trigger:
  - release/*
  - hotfix/*

pool:
  vmImage: ubuntu-20.04

variables:
  FEED_ID: 61101818-286e-47e5-b86b-ef800ee02eea
  # Don't forget add trailing slash ('/').
  BUILD_DEST_PATH: dist/martha-web/browser/
  APM_URL: https://f51291eec6a94ce2a7309a312be33aa7.apm.ap-southeast-1.aws.cloud.es.io:443

resources:
  repositories:
    - repository: templates
      type: git
      name: Operations/pipeline-templates

jobs:
  - template: web/unit_test.yml@templates
    parameters:
      feedId: $(FEED_ID)

  - template: web/build.yml@templates
    parameters:
      appEnv: production
      jobName: build_packaging_prod
      feedId: $(FEED_ID)
      buildPath: $(BUILD_DEST_PATH)
      env_vars: APM_NAME=mt-web APM_ACTIVE=True APM_URL=$(APM_URL)

  - template: web/build.yml@templates
    parameters:
      appEnv: staging
      jobName: build_packaging_staging
      feedId: $(FEED_ID)
      buildPath: $(BUILD_DEST_PATH)
      env_vars: APM_NAME=mt-web-staging APM_ACTIVE=False APM_URL=$(APM_URL)
