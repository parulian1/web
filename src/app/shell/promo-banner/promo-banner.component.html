<div class="promo-brands" *ngIf="!!banners && banners.length>0">
  <span class="title">Promo Pilihan</span>
  <div class="list-promo">
    <div class="left">
      <ng-container *ngFor="let banner of banners; let i = index">
        <ng-container *ngIf="i === 0 || i === 1">
          <a [routerLink]="[banner.clickUrl]">
            <img src="{{banner.image}}" alt="{{banner.name}}"/>
          </a>
        </ng-container>
      </ng-container>
    </div>
    <div class="right">
      <ng-container *ngFor="let banner of banners; let i = index">
        <ng-container *ngIf="i > 1">
          <a [routerLink]="[banner.clickUrl]">
            <img src="{{banner.image}}" alt="{{banner.name}}"/>
          </a>
        </ng-container>
      </ng-container>
    </div>
  </div>
</div>

</div>
