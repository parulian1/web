<ngx-slick-carousel
  class="main-carousel"
  [config]="slidesConfig">
  <div ngxSlickItem *ngFor="let item of banners">
    <div class="carousel-cell">
      <a href="{{item.clickUrl}}">
        <img
          appResponsiveImgChooser
          [source]="{ defaultImg: item.image, mobileImg: item.phoneImage, tabletImg: item.tabletImage }"
          alt="{{item.name}}"/>
      </a>
    </div>
  </div>
</ngx-slick-carousel>
