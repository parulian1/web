<button mat-icon-button
        *ngFor="let ratingId of ratingArr;index as i" [id]="'star_'+i"
        [color]="color"
        [style]="setSize()"
        [ngStyle]="{'color': color}"
        (click)="onClick(i+1)">
  <mat-icon [style]="setIcon()">
    {{showIcon(i)}}
  </mat-icon>
</button>
<mat-error *ngIf="starCount == null || starCount == 0">
  Star count is <strong>required</strong> and cannot be zero
</mat-error>
