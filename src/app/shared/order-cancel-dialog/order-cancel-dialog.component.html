<div class="order-cancel-dialog">
  <div class="btn-close">
    <span (click)="onClose()">X</span>
  </div>
  <div class="header-cancel-dialog">
    <span class="text-title-1">Batalkan Pesanan</span>
  </div>
  <p class="text-body2">
    Anda Yakin untuk membatalkan pesanan ?
  </p>

  <div class="buttons">
    <button class="btn btn-outline" (click)="onCancel()">Batal</button>
    <button class="btn btn-primary" (click)="onYes()">Yakin</button>
  </div>
</div>
