<div class="video-player" (click)="popUpVideo()">
  <div class="video-player-top">
    <span class="title" *ngIf="!!title">{{ title.length > 15 ? (title | slice:0:15) + '...' : title }}</span>
  </div>
  <i class="material-icons play-icon">play_arrow</i>
  <img class="video-player-thumbnail" src="{{ thumbnail }}">
</div>
