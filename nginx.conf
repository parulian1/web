user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format graylog2_json escape=json '{ "timestamp": "$time_iso8601", '
                             '"remote_addr": "$remote_addr", '
                              '"body_bytes_sent": $body_bytes_sent, '
                              '"request_time": $request_time, '
                              '"response_status": $status, '
                              '"request": "$request", '
                              '"request_method": "$request_method", '
                              '"host": "$host", '
                              '"upstream_cache_status": "$upstream_cache_status", '
                              '"upstream_addr": "$upstream_addr", '
                              '"http_x_forwarded_for": "$http_x_forwarded_for", '
                              '"http_referrer": "$http_referer", '
                              '"http_user_agent": "$http_user_agent", '
                              '"http_x_user_agent": "$http_x_user_agent", '
                              '"http_request_id": "$request_id" }';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD, PUT, PATCH, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,DNT,User-Agent,X-User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Max-Age' 1728000;

    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path   /tmp/ levels=1:2 keys_zone=s3_cache:10m max_size=500m inactive=60m use_temp_path=off;
    proxy_cache_key             "$scheme$host$request_uri";
    proxy_send_timeout          120;
    proxy_connect_timeout       120;
    proxy_read_timeout          120;
    send_timeout                180;
    proxy_buffer_size           128K;
    proxy_buffers               4 128k;
    proxy_busy_buffers_size     256k;

    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types image/svg+xml
               image/svg
               text/plain
               text/javascript
               text/css
               text/xml
               image/jpg
               image/jpeg
               image/png
               image/gif
               application/xml
               application/xml+rss
               application/javascript
               application/x-javascript
               application/json
               application/atom+xml
               application/ld+json
               application/manifest+json
               application/vnd.geo+json
               application/vnd.ms-fontobject
               application/x-font-ttf
               application/x-web-app-manifest+json
               application/xhtml+xml
               font/opentype
               image/bmp
               image/x-icon
               text/cache-manifest
               text/vcard
               text/vnd.rim.location.xloc
               text/vtt
               text/x-component
               text/x-cross-domain-policy;

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/* image/*;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri$args $uri$args/ $uri $uri/ /index.html =404 ;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header x-user-agent $http_x_user_agent;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        location /uploads {
        proxy_redirect off;
        proxy_set_header       Connection "";
        proxy_set_header       Authorization '';   
        proxy_set_header       Host cdn.bhisma.cloud;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header      x-amz-id-2;
        proxy_hide_header      x-amz-request-id;
        proxy_hide_header      x-amz-meta-server-side-encryption;
        proxy_hide_header      x-amz-server-side-encryption;
        proxy_hide_header      Set-Cookie;
        proxy_ignore_headers   Set-Cookie;
        proxy_intercept_errors on;
        add_header             Cache-Control max-age=31536000;
        add_header             X-Cache-Status $upstream_cache_status;
        proxy_pass             https://cdn.bhisma.cloud;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
