# This is an NGINX config file, intended for **local** development use
# only, within the docker-compose.yml file in this repo.
#
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format graylog2_json escape=json '{ "timestamp": "$time_iso8601", '
                             '"remote_addr": "$remote_addr", '
                              '"body_bytes_sent": $body_bytes_sent, '
                              '"request_time": $request_time, '
                              '"response_status": $status, '
                              '"request": "$request", '
                              '"request_method": "$request_method", '
                              '"host": "$host", '
                              '"upstream_cache_status": "$upstream_cache_status", '
                              '"upstream_addr": "$upstream_addr", '
                              '"http_x_forwarded_for": "$http_x_forwarded_for", '
                              '"http_referrer": "$http_referer", '
                              '"http_user_agent": "$http_user_agent", '
                              '"http_x_user_agent": "$http_x_user_agent", '
                              '"http_request_id": "$request_id" }';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD, PUT, PATCH, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,DNT,User-Agent,X-User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Max-Age' 1728000;

    sendfile        on;
    keepalive_timeout  65;

    upstream iam { server iam-api.nusantara:8000; }
    upstream fulfillment { server fulfillment-api.nusantara:8000; }
    upstream cms { server cms-api.nusantara:8000; }
    upstream catalog { server catalog-api.nusantara:8000; }


    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri$args $uri$args/ $uri $uri/ ;
        }

        location /api/iam {
            proxy_pass "http://iam";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

       location /api/fulfillment {
            proxy_pass "http://fulfillment";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        location /api/cms {
            proxy_pass "http://cms";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        location /api/catalog {
            proxy_pass "http://catalog";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
