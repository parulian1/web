# This is an NGINX config file, intended for **local** development use
# only, within the docker-compose.yml file in this repo.
#
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format graylog2_json escape=json '{ "timestamp": "$time_iso8601", '
                             '"remote_addr": "$remote_addr", '
                              '"body_bytes_sent": $body_bytes_sent, '
                              '"request_time": $request_time, '
                              '"response_status": $status, '
                              '"request": "$request", '
                              '"request_method": "$request_method", '
                              '"host": "$host", '
                              '"upstream_cache_status": "$upstream_cache_status", '
                              '"upstream_addr": "$upstream_addr", '
                              '"http_x_forwarded_for": "$http_x_forwarded_for", '
                              '"http_referrer": "$http_referer", '
                              '"http_user_agent": "$http_user_agent", '
                              '"http_x_user_agent": "$http_x_user_agent", '
                              '"http_request_id": "$request_id" }';

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD, PUT, PATCH, DELETE';
    add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,DNT,User-Agent,X-User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    add_header 'Access-Control-Max-Age' 1728000;

    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path            /var/cache/nginx levels=1:2 keys_zone=proxy:8m max_size=256M inactive=600m;
    proxy_temp_path             /var/cache/nginx/tmp;
    proxy_cache_key             "$scheme$host$request_uri";
    proxy_send_timeout          120;
    proxy_connect_timeout       120;
    proxy_read_timeout          120;
    send_timeout                180;
    proxy_buffer_size           128K;
    proxy_buffers               4 128k;
    proxy_busy_buffers_size     256k;

    gzip on;
    gzip_disable "msie6";
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types image/svg+xml
               image/svg
               text/plain
               text/javascript
               text/css
               text/xml
               image/jpg
               image/jpeg
               image/png
               image/gif
               application/xml
               application/xml+rss
               application/javascript
               application/x-javascript
               application/json
               application/atom+xml
               application/ld+json
               application/manifest+json
               application/vnd.geo+json
               application/vnd.ms-fontobject
               application/x-font-ttf
               application/x-web-app-manifest+json
               application/xhtml+xml
               font/opentype
               image/bmp
               image/x-icon
               text/cache-manifest
               text/vcard
               text/vnd.rim.location.xloc
               text/vtt
               text/x-component
               text/x-cross-domain-policy;
               
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/* image/*;

    upstream iam { server iam-api.nusantara:8000; }
    upstream fulfillment { server fulfillment-api.nusantara:8000; }
    upstream cms { server cms-api.nusantara:8000; }
    upstream catalog { server catalog-api.nusantara:8000; }

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri$args $uri$args/ $uri $uri/ ;
        }

        location /api/iam {
            proxy_pass "http://iam";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

       location /api/fulfillment {
            proxy_pass "http://fulfillment";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        location /api/cms {
            proxy_pass "http://cms";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        location /api/catalog {
            proxy_pass "http://catalog";
            proxy_set_header Host $host;
            client_max_body_size 20M;
            keepalive_timeout 0;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
